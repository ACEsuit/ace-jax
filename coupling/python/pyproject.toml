[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ace-jax-coupling"
version = "0.1.0"
description = "EquivariantTensors.jl SO(3) coupling tables for ace-jax, as a juliac-compiled library (no Julia needed)"
readme = "README.md"
requires-python = ">=3.11"
# No `license =` expression yet: the wheel bundles GPL-2.0+ SuiteSparse modules
# (see THIRD_PARTY_NOTICES.md); the declaration is decided before any publication.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "ACEsuit contributors" }]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ACEsuit/ace-jax"

[tool.hatch.build.targets.wheel]
packages = ["src/ace_jax_coupling"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "licenses"]
