# family -> size entries; `size` names the run directory runs/<family>/<size>
ace:          # linear: aj fit --m-per-species 0; n_B from `aj basis` (Si, rcut 5.0)
  - {size: o3d8, order: 3, max_degree: 8, n_B: 54}
  - {size: o3d10, order: 3, max_degree: 10, n_B: 110}
  - {size: o3d12, order: 3, max_degree: 12, n_B: 211}
  - {size: o4d12, order: 4, max_degree: 12, n_B: 338}
  - {size: o4d14, order: 4, max_degree: 14, n_B: 710}
  - {size: o4d16, order: 4, max_degree: 16, n_B: 1445, configs_per_batch: 2}
  - {size: o4d20, order: 4, max_degree: 20, n_B: 5456, configs_per_batch: 1}
ace_lr:       # linear + aj fit --learn-radial; the same (order, max_degree) pairs and n_B as ace
  - {size: o3d8, order: 3, max_degree: 8, n_B: 54}
  - {size: o3d10, order: 3, max_degree: 10, n_B: 110}
  - {size: o3d12, order: 3, max_degree: 12, n_B: 211}
  - {size: o4d12, order: 4, max_degree: 12, n_B: 338}
  - {size: o4d14, order: 4, max_degree: 14, n_B: 710}
  - {size: o4d16, order: 4, max_degree: 16, n_B: 1445, configs_per_batch: 2}
  - {size: o4d20, order: 4, max_degree: 20, n_B: 5456, configs_per_batch: 1}
ace_gp:       # aj fit --m-per-species m; base pairs are the smallest, middle and largest-but-one ace pairs
  - {size: o3d8-m100, order: 3, max_degree: 8, m: 100}
  - {size: o3d8-m500, order: 3, max_degree: 8, m: 500}
  - {size: o3d12-m100, order: 3, max_degree: 12, m: 100}
  - {size: o3d12-m500, order: 3, max_degree: 12, m: 500}
  - {size: o4d14-m100, order: 4, max_degree: 14, m: 100}
pace:         # one ladder fit; sizes are checkpoints (functions per element)
  - {size: ladder, max_functions: 800, ladder_step: 50, take: [50, 100, 200, 400, 800]}
  # the ladder continued from f800 on Sulis on a larger target spec (nradmax 15,8,6,4,3,2 / lmax
  # 0,5,4,3,2,1: 5857 functions) in max(100, 30%) steps: envs/sulis-pace-ladder.*; sizes are the
  # checkpoints' function counts, converted by hand (fit_pace's take/convert reads `ladder` only)
  - {size: ladder_ext, max_functions: 3200, ladder_step: [100, 0.3], take: [1040, 1352, 1758, 2285, 2971, 3200]}
mace:         # mace_run_train from scratch, 2 layers, max_ell 3, correlation 3
  - {size: c8L0,  channels: 8,  max_L: 0}
  - {size: c16L0, channels: 16, max_L: 0}
  - {size: c32L0, channels: 32, max_L: 0}
  - {size: c16L1, channels: 16, max_L: 1}
  - {size: c32L1, channels: 32, max_L: 1}
  - {size: c64L1, channels: 64, max_L: 1}
  # one interaction layer (receptive field = the 5 A cutoff, as ACE and GAP): separates message passing from
  # MACE's many-channel nonlinear model.  Trained on a Sulis A100 (envs/sulis-mace.sbatch)
  - {size: c16L0n1, channels: 16, max_L: 0, interactions: 1}
  - {size: c32L0n1, channels: 32, max_L: 0, interactions: 1}
gap:          # GAP-18's gap_fit command line, only n_sparse changed
  - {size: s1000, n_sparse: 1000}
  - {size: s3000, n_sparse: 3000}
  - {size: s9000, n_sparse: 9000}
ace_pshape:    # PACE-shaped ACE, fixed SBessel radials (runs/accuracy_cost/pace_shape/md<N>_sb_fixed): order 6, wL 1,
               # --nmax-by-order 15,6,4,3,2,2 --lmax-by-order 0,4,3,2,1,0 --radial-basis sbessel; md18 ~ pacemaker's f800 spec
  - {size: md10}
  - {size: md12}
  - {size: md14}
  - {size: md18}
ace_pshape_lr: # the same, radials learned (pace_shape/md<N>_sb_lr200: 200 steps, lam 0)
  - {size: md10}
  - {size: md12}
  - {size: md14}
  - {size: md18}
ace_wl:        # linear ACE at other angular weights wL (wl_ladder/PLAN.md: the 12-fit subset, fitted on Sulis)
  - {size: o4d13_wL2}
  - {size: o5d14_wL2}
  - {size: o4d12_wL1}
  - {size: o4d15_wL2}
  - {size: o4d16_wL2.5}
  - {size: o4d15_wL1.75}
  - {size: o4d17_wL1.75}
  - {size: o4d19_wL2.5}
  - {size: o4d14_wL1}
  - {size: o4d18_wL2}
  - {size: o5d17_wL2}
  - {size: o4d21_wL2}
  - {size: o4d22_wL2}
  - {size: o4d24_wL2}
gap_noglue:    # GAP-18's command without the glue core (runs/accuracy_cost/gap/s<N>_noglue, registered as gap_noglue/s<N>)
  - {size: s1000, n_sparse: 1000}
  - {size: s3000, n_sparse: 3000}
  - {size: s9000, n_sparse: 9000}
gap_E30:       # GAP-18's command with energy sigmas x10/3: ace-jax's E30:F1 balance (Sulis gap-runs/gap_s<N>_E30.sbatch)
  - {size: s1000, n_sparse: 1000}
  - {size: s3000, n_sparse: 3000}
  - {size: s9000, n_sparse: 9000}
ace_yace:      # the ace ladder's o4 models as upstream ML-PACE .yace, radials refitted (ace_to_yace.py --radial sbessel --nradbase 80): timing only
  - {size: o4d12}
  - {size: o4d14}
  - {size: o4d16}
  - {size: o4d20}
ace_tab:       # the same, exactly: Tabulated radials (write_yace), for ML-PACE with the tabulated-radial patch
  - {size: o4d12}
  - {size: o4d14}
  - {size: o4d16}
  - {size: o4d20}
nep:           # NEP4 trained by GPUMD's nep on a Sulis A100 (fit_nep.py; envs/sulis-nep.sbatch): cutoff 5 A radial and
               # angular; n_max "R A", basis_size "R A", l_max "<3-body l> <q_222 4-body> [<q_1111 5-body>]" (on/off),
               # neuron = hidden-layer width.  generation: total (default 100k; n50 is flat from 70k, n80/n120 were
               # still improving at 100k), trained in jobs of `chunk` generations that resume from nep.restart
  - {size: n10,  n_max: "4 4",   basis_size: "4 4",   l_max: "4 0",   neuron: 10}
  - {size: n30,  n_max: "6 4",   basis_size: "6 6",   l_max: "4 1",   neuron: 30}
  - {size: n50,  n_max: "8 6",   basis_size: "8 8",   l_max: "4 1",   neuron: 50}
  - {size: n80,  n_max: "10 8",  basis_size: "8 8",   l_max: "6 1",   neuron: 80,  generation: 300000, chunk: 100000}
  - {size: n120, n_max: "12 8",  basis_size: "8 8",   l_max: "6 1",   neuron: 120, generation: 300000, chunk: 100000}
  # GPUMD's caps (main_nep/parameters.cu): n_max <= "12 8", basis_size <= "16 12", 3-body l_max <= 8, <= 120
  # neurons a layer, and NEP_CPU / GPUMD's MD evaluate one hidden layer only: n120 is already at the n_max and
  # width caps, so the larger models widen the basis and add the 4- and 5-body terms
  - {size: n120b, n_max: "12 8", basis_size: "12 12", l_max: "6 1 1", neuron: 120, generation: 300000, chunk: 100000}
  - {size: n120c, n_max: "12 8", basis_size: "16 12", l_max: "8 1 1", neuron: 120, generation: 200000, chunk: 100000}   # third chunk cancelled: no better than n120b
  # 30k-generation screens on n120b's descriptor (compare test force RMSE with n120b's own curve at 30k): a longer
  # radial / shorter angular cutoff, and weaker L1 / L2 regularisation (GPUMD's default ~0.10 here dominates the loss)
  - {size: n120b-c64,    n_max: "12 8", basis_size: "12 12", l_max: "6 1 1", neuron: 120, generation: 30000, cutoff: "6 4"}
  - {size: n120b-c65,    n_max: "12 8", basis_size: "12 12", l_max: "6 1 1", neuron: 120, generation: 30000, cutoff: "6 5"}
  - {size: n120b-reg,    n_max: "12 8", basis_size: "12 12", l_max: "6 1 1", neuron: 120, generation: 30000, lambda_1: 0.01, lambda_2: 0.01}
  - {size: n120b-c64reg, n_max: "12 8", basis_size: "12 12", l_max: "6 1 1", neuron: 120, generation: 30000, cutoff: "6 4", lambda_1: 0.01, lambda_2: 0.01}
  # the published GAP-18 Si recipe (Fan et al., arXiv:2205.10046 Fig. 4, the 5-body NEP4 shipped as GPUMD's
  # Si_2022_NEP4_5body.txt, n_max "10 10"; GPUMD 5.9 caps the angular n_max at 8): full batch, lambda 0.05,
  # population 50, 300k generations; without weights (as published) and with the GAP-18 force-sigma weights.
  # That shipped model, trained on all of GAP-18, scores 0.0998 eV/A on this test split (an optimistic bound:
  # the test configs are in its training set)
  - {size: nlit,  n_max: "10 8", basis_size: "10 10", l_max: "4 2 1", neuron: 50, lambda_1: 0.05, lambda_2: 0.05, population: 50, batch: 100000, weights: none, generation: 100000, chunk: 100000}   # stopped at 100k: not below n120b
  - {size: nlitw, n_max: "10 8", basis_size: "10 10", l_max: "4 2 1", neuron: 50, lambda_1: 0.05, lambda_2: 0.05, population: 50, batch: 100000, generation: 100000, chunk: 100000}   # stopped at 100k: tracks nlit ~0.002 eV/A behind
grace:         # GRACE-1L from scratch (fit_grace.py, gracemaker 0.6.2.1, float64 parameters): GRACE_1LAYER_latest's
               # architecture (grace_custom.grace_1l, readout "mlp"), cutoff 5 A; channels = prod_func_n_max, oN = max_order.
               # n_rad_max <= 32 and MLP widths <= 64 keep every size inside pair_style grace/1l/kk's caps.
               # c32o4 / c64o4 are the preset's "small" / "medium" settings; n_params from fit_grace.n_params.
               # Runs: runs/grace/<size>_s<seed>, seeds 0 1 2
  - {size: c8o3,  lmax: 3, n_rad_max: 8,  prod_func_n_max: 8,  max_order: 3, n_mlp_dens: 4,  n_rad_base: 8, n_params: 11081}
  - {size: c16o3, lmax: 3, n_rad_max: 16, prod_func_n_max: 16, max_order: 3, n_mlp_dens: 8,  n_rad_base: 8, n_params: 23057}
  - {size: c16o4, lmax: 4, n_rad_max: 16, prod_func_n_max: 16, max_order: 4, n_mlp_dens: 8,  n_rad_base: 8, n_params: 55505}
  - {size: c32o4, lmax: 4, n_rad_max: 32, prod_func_n_max: 32, max_order: 4, n_mlp_dens: 10, n_rad_base: 8, n_params: 171937}
  - {size: c64o4, lmax: 4, n_rad_max: 32, prod_func_n_max: 64, max_order: 4, n_mlp_dens: 12, n_rad_base: 8, n_params: 445793}
grace_fs:      # GRACE-FS (gracemaker preset FS: linear radials, SBessel, Finnis-Sinclair readout), its small / medium
               # settings at cutoff 5 A; LAMMPS: pair_style grace/fs (C++ YAML export)
  - {size: fs_small,  preset: FS, max_order: 3, lmax: [5, 5, 4],    n_rad_max: [20, 15, 10],    embedding_size: 32,
     fs_parameters: [[1.0, 1.0], [1.0, 0.5]], n_params: 3432}
  - {size: fs_medium, preset: FS, max_order: 4, lmax: [5, 5, 4, 3], n_rad_max: [20, 15, 10, 5], embedding_size: 64,
     fs_parameters: [[1.0, 1.0], [1.0, 0.5], [1.0, 2], [1.0, 0.75]], n_params: 4564}
grace_abl:     # one change each to the `grace` size nearest the target (`base`; c16o4 is a placeholder until the ladder
               # is scored).  linro: one linear density, no MLP (LinearOut2Target).  frozenR: the radial MLP (R_Linear_*)
               # left at its random initialisation, every other variable trained (fit::trainable_variable_names).
               # o3: max_order 3
  - {size: c16o4_linro,   base: c16o4, readout: linear}
  - {size: c16o4_frozenR, base: c16o4, freeze_radial: true,
     trainable: ["A_ChemIndTransf/", "A1/w_", "AA1/w_", "AA2/w_", "LinMLPOut2ScalarTarget_MLP", "tr_atomic_shift", "Z/ChemicalEmbedding", "rho/reducing_"]}
  - {size: c16o4_o3,      base: c16o4, max_order: 3}
