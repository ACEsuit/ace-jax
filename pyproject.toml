[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-jax"
version = "0.2.1"
description = "Fit and evaluate ACE interatomic potentials in Python/JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ACEsuit contributors" }]
keywords = ["ace", "interatomic-potential", "jax", "molecular-dynamics", "chemistry", "gaussian-process"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax>=0.10.1",
  "equinox>=0.11",
  "numpy>=1.24",
  "scipy>=1.10",
  "lineax>=0.1.1",
  "ase>=3.22",          # core: neighbour-list fallback (eval) + calculators + element data
  "pyyaml>=6",          # .yace (PACE) model files
  # training/eval data reader (libAtoms C parser, binary wheels): labels come back
  # as written, independent of ASE's calculator-key handling (see fit/xyz.py)
  "extxyz>=0.4.6",
  # aj eval writes its extxyz output through the ASE plugin (create_calc=False keeps every
  # label under its own name); 0.1.2 / extxyz 0.4.6 fixed a transposed Lattice on write
  "ase-extxyz>=0.1.2",
  # the fit pipeline: the theta-MAP (numpyro SVI) and the L-BFGS / Adam optimisers (optax)
  "numpyro>=0.16",
  "optax>=0.2",
  # coupling tables for new basis shapes (a compiled library, nothing to install
  # besides the wheel); platform wheels only -- elsewhere fit from an existing .npz
  "ace-jax-coupling==0.2.0; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.optional-dependencies]
# The pathfinder rung of the hyperparameter UQ ladder (everything else in `aj fit`,
# GP arm included, needs only the core dependencies).
gp = ["blackjax>=1.6"]
cuda = ["jax[cuda12]>=0.10.1"]
# Fast neighbour lists; ace-jax uses them when present and falls back to ASE's
# list otherwise, so they are intentionally NOT core deps.  matscipy-neighbours
# (preferred: OpenMP CPU, native dense neighbour_matrix) ships as a source
# distribution: installing it compiles C++ (CMake + a C++17 compiler).  For its
# GPU backend (graph built on the device, handed to JAX via DLPack):
#   pip install -C cmake.define.ENABLE_CUDA=ON \
#       -C cmake.define.CMAKE_CUDA_ARCHITECTURES=<sm> matscipy-neighbours
fast-neighbours = ["matscipy-neighbours>=1.0"]

[project.scripts]
ace-jax = "ace_jax.cli:main"
aj = "ace_jax.cli:main"          # short alias

[project.urls]
Homepage = "https://github.com/ACEsuit/ace-jax"
Documentation = "https://acesuit.github.io/ace-jax/"
Source = "https://github.com/ACEsuit/ace-jax"
Issues = "https://github.com/ACEsuit/ace-jax/issues"
Changelog = "https://github.com/ACEsuit/ace-jax/blob/main/CHANGELOG.md"

[dependency-groups]
# mirrors the `gp` extra so a plain `uv run pytest` can run the GP ladder tests
dev = [
  "pytest>=8", "pytest-split>=0.8", "pytest-xdist>=3.5", "numpyro>=0.16", "optax>=0.2", "blackjax>=1.6",
  # lint + hooks; keep ruff in step with the rev in .pre-commit-config.yaml
  "ruff==0.16.9", "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ace_jax"]

[tool.hatch.build.targets.sdist]
include = ["/src/ace_jax", "/README.md", "/LICENSE"]   # anchored: unanchored names match nested READMEs too

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# `slow` (real-model ladder, bit-exact goldens) is opt-in: `pytest -m slow`
addopts = "--durations=15 -m 'not slow'"
markers = [
    "slow: heavy integration (real-model MCMC ladder, bit-exact driver goldens); excluded by default -- run with `pytest -m slow`",
]

[tool.ruff]
# ~99.9% of src/tests lines are <= 110 already; no formatter is enforced
# (`ruff format` would rewrite the deliberately dense one-line style).
line-length = 110
target-version = "py311"                       # requires-python >= 3.11
# Not linted: reference generators / experiments that are not part of the package.
extend-exclude = ["pace_ref", "julia", "docs", "fixtures", ".worktrees"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade; NPY guards NumPy-2 removals.
# No "I" (isort): ruff's isort always splits `import a, b` and re-wraps dense
# parenthesised imports one-per-line (74 files, +270/-138), and reorders package
# __init__ imports; that is a restyle, not a fix.
select = ["E", "F", "W", "B", "UP", "NPY"]
ignore = [
  # House style, not bugs: dense `a = ...; b = ...` lines, one-line `if x: y`,
  # short math names (l, I, O), named lambdas, `import os, sys`.
  "E701", "E702", "E741", "E731", "E401",
  # Imports after jax.config.update("jax_enable_x64", ...) / importorskip are deliberate.
  "E402",
  # Long lines are tolerated (no formatter); line-length documents the target.
  "E501",
  # zip(strict=True) would change behaviour on length mismatch; opt in case by case.
  "B905",
]


[tool.ruff.lint.per-file-ignores]
# B023 (closure over a loop variable): every site in these files was reviewed and
# is a false positive -- the closure is consumed in the same iteration
# (`jax.tree.map(lambda a: a[i], ds)`, in-loop jit timing).  Listed per file so
# the rule still guards new files.
"bench/learn_radial/compare_plots.py" = ["B023"]
"bench/learn_radial/plots.py" = ["B023"]
"bench/learn_radial/rmse.py" = ["B023"]
"bench/learn_radial/rmse_npz.py" = ["B023"]
"bench/learn_radial/tradeoff.py" = ["B023"]
"src/ace_jax/fit/hostcache.py" = ["B023"]
"src/ace_jax/fit/pipeline/predict.py" = ["B023"]
"src/ace_jax/fit/predict.py" = ["B023"]
"src/ace_jax/fit/radial_model.py" = ["B023"]
"src/ace_jax/fit/solve.py" = ["B023"]
"src/ace_jax/fit/stats.py" = ["B023"]
"tests/test_ard.py" = ["B023"]
"tests/test_gp_learn_radial.py" = ["B023"]
"tests/test_gp_pops_paper.py" = ["B023"]
"tests/test_gp_rows.py" = ["B023"]
"tests/test_gp_stats.py" = ["B023"]
"tests/test_radial_learn_flags.py" = ["B023"]
"tests/test_rows_chunked.py" = ["B023"]
