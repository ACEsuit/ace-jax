name: docs
# The user documentation site (MkDocs Material, docs_dir docs/user) and the
# tutorial notebooks.
#  - pull requests: render each tutorial notebook on CPU in its own job (each must
#    run top to bottom without an error), then build the site with --strict from
#    those pages, and publish it as a preview at <site>/pr/<number>/ (branches of
#    this repository only: a fork's token cannot write);
#  - push to main: the same, then publish the site at the root.
# The notebooks are most of the time (~30 min run serially), so they run in
# parallel, and a page whose inputs are unchanged comes from the actions cache.
# Publishing writes the gh-pages branch (docs/publish_pages.sh), so the repository's
# Pages source must be "Deploy from a branch": gh-pages, / (root)
# (Settings -> Pages -> Build and deployment).  Previews are public but not linked
# from the site and marked noindex; docs-preview-cleanup.yml removes one when its
# pull request closes.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - tests/test_tutorial_notebooks.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - tests/test_tutorial_notebooks.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorials-matrix:
    # the notebook -> page list, from docs/build_tutorials.py, so the matrix cannot drift
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(python3 docs/build_tutorials.py --matrix)" >> "$GITHUB_OUTPUT"

  tutorial:
    # One notebook per job: run it and convert it to its page (a cell that raises
    # fails the job).  The cache key is every input the page depends on (the
    # notebook, the converter, the library and its lock, the tutorial data); only
    # an exact hit is used, so a stale page is never restored.
    needs: tutorials-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tutorials-matrix.outputs.matrix) }}
    name: tutorial (${{ matrix.notebook }})
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            docs/user/tutorials/${{ matrix.page }}.md
            docs/user/tutorials/${{ matrix.page }}_files
          key: tutorial-${{ matrix.notebook }}-${{ hashFiles(format('docs/user/tutorials/notebooks/{0}.py', matrix.notebook), 'docs/build_tutorials.py', 'docs/requirements.txt', 'docs/user/tutorials/data/**', 'fixtures/si_tiny_train.xyz', 'src/**', 'pyproject.toml', 'uv.lock') }}
      - uses: astral-sh/setup-uv@v5
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Install ace-jax and the docs toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv sync --python 3.12 --frozen
          uv pip install -r docs/requirements.txt
      - name: Render ${{ matrix.notebook }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --no-sync python docs/build_tutorials.py ${{ matrix.notebook }}
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-${{ matrix.page }}
          path: |
            docs/user/tutorials/${{ matrix.page }}.md
            docs/user/tutorials/${{ matrix.page }}_files
          if-no-files-found: error
          retention-days: 3

  build:
    # The site, from the rendered pages: their stamps match the notebooks, so the
    # mkdocs hook re-runs none (ACEJAX_DOCS_NOTEBOOKS=require makes a mismatch an
    # error rather than a silent serial re-run).
    needs: tutorial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ace-jax and the docs toolchain
        # the CLI reference is rendered from `aj --help` and the API reference
        # from the docstrings, so the package itself must be importable
        run: |
          uv sync --python 3.12 --frozen
          uv pip install -r docs/requirements.txt
      - name: Tutorial notebook cell graphs (needs marimo, a docs dependency)
        run: uv run --no-sync pytest -n 0 -q -p no:cacheprovider tests/test_tutorial_notebooks.py
      - uses: actions/download-artifact@v4
        with:
          pattern: tutorial-*
          path: docs/user/tutorials
          merge-multiple: true
      - name: Build the site (strict)
        env:
          ACEJAX_DOCS_NOTEBOOKS: require
        run: uv run --no-sync mkdocs build --strict
      - name: Upload the site
        # also the offline preview for a fork's pull request: download `site` from the run's summary page, unzip
        # it and serve it over HTTP (`python -m http.server -d site`): interactive figures fetch their JSON,
        # which file:// blocks
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  publish:
    # main: the site root.  A pull request from a branch of this repository: pr/<number>/.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # the publish script from the base branch, not from the pull request: this job has a write token
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: docs/publish_pages.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEST: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || '' }}
        run: |
          if [ ! -x docs/publish_pages.sh ]; then   # the pull request that adds the script: its base has none
            echo "::notice::no docs/publish_pages.sh on the base branch; nothing published"; exit 0
          fi
          docs/publish_pages.sh site $DEST
          echo "Published: https://acesuit.github.io/ace-jax/${DEST:+$DEST/}" >> "$GITHUB_STEP_SUMMARY"
