name: docs
# The user documentation site (MkDocs Material, docs_dir docs/user) and the
# tutorial notebooks.
#  - pull requests: build the site with --strict and run every tutorial
#    notebook headless on CPU (each must run top to bottom without an error);
#  - push to main: the same, then deploy the site to GitHub Pages.
# Deploying needs the repository's Pages source set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ace-jax and the docs toolchain
        # the CLI reference is rendered from `aj --help` and the API reference
        # from the docstrings, so the package itself must be importable
        run: |
          uv sync --python 3.12 --frozen
          uv pip install -r docs/requirements.txt
      - name: Build the site (strict)
        env:
          JAX_PLATFORMS: cpu
        run: uv run --no-sync mkdocs build --strict
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  notebooks:
    # Headless smoke run of each tutorial against this checkout (not the git
    # URL in the notebooks' PEP 723 header): a marimo notebook run as a script
    # executes every cell and exits non-zero if any cell raises.  Each takes a
    # few minutes on CPU.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        notebook: [first_fit_si, learned_radials_si]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ace-jax, marimo and matplotlib
        run: |
          uv sync --python 3.12 --frozen
          uv pip install -r docs/requirements.txt matplotlib
      - name: Run ${{ matrix.notebook }}
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        working-directory: ${{ runner.temp }}
        run: uv run --no-sync --project "$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/docs/user/tutorials/notebooks/${{ matrix.notebook }}.py"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, notebooks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
