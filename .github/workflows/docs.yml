name: docs
# The user documentation site (MkDocs Material, docs_dir docs/user) and the
# tutorial notebooks.
#  - pull requests: build the site with --strict; the build runs every tutorial
#    notebook on CPU to render its page (each must run top to bottom without an error);
#  - push to main: the same, then deploy the site to GitHub Pages.
# Deploying needs the repository's Pages source set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - tests/test_tutorial_notebooks.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - tests/test_tutorial_notebooks.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The tutorial pages are rendered by running each notebook (docs/build_tutorials.py,
    # from the mkdocs hook): a notebook whose cell raises fails the build.
    runs-on: ubuntu-latest
    timeout-minutes: 60     # nine tutorials render in ~30 min on a local CPU
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ace-jax and the docs toolchain
        # the CLI reference is rendered from `aj --help` and the API reference
        # from the docstrings, so the package itself must be importable
        run: |
          uv sync --python 3.12 --frozen
          uv pip install -r docs/requirements.txt
      - name: Tutorial notebook cell graphs (needs marimo, a docs dependency)
        run: uv run --no-sync pytest -n 0 -q -p no:cacheprovider tests/test_tutorial_notebooks.py
      - name: Build the site (strict), rendering the tutorial notebooks
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --no-sync mkdocs build --strict
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
