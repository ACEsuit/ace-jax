name: docs
# The user documentation site (MkDocs Material, docs_dir docs/user) and the
# tutorial notebooks.
#  - pull requests: render each tutorial notebook on CPU in its own job (each must
#    run top to bottom without an error), then build the site with --strict from
#    those pages;
#  - push to main: the same, then deploy the site to GitHub Pages.
# The notebooks are most of the time (~30 min run serially), so they run in
# parallel, and a page whose inputs are unchanged comes from the actions cache.
# Deploying needs the repository's Pages source set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - tests/test_tutorial_notebooks.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - uv.lock
      - fixtures/si_tiny_train.xyz
      - tests/test_tutorial_notebooks.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorials-matrix:
    # the notebook -> page list, from docs/build_tutorials.py, so the matrix cannot drift
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(python3 docs/build_tutorials.py --matrix)" >> "$GITHUB_OUTPUT"

  tutorial:
    # One notebook per job: run it and convert it to its page (a cell that raises
    # fails the job).  The cache key is every input the page depends on (the
    # notebook, the converter, the library and its lock, the tutorial data); only
    # an exact hit is used, so a stale page is never restored.
    needs: tutorials-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tutorials-matrix.outputs.matrix) }}
    name: tutorial (${{ matrix.notebook }})
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            docs/user/tutorials/${{ matrix.page }}.md
            docs/user/tutorials/${{ matrix.page }}_files
          key: tutorial-${{ matrix.notebook }}-${{ hashFiles(format('docs/user/tutorials/notebooks/{0}.py', matrix.notebook), 'docs/build_tutorials.py', 'docs/requirements.txt', 'docs/user/tutorials/data/**', 'fixtures/si_tiny_train.xyz', 'src/**', 'pyproject.toml', 'uv.lock') }}
      - uses: astral-sh/setup-uv@v5
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Install ace-jax and the docs toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv sync --python 3.12 --frozen
          uv pip install -r docs/requirements.txt
      - name: Render ${{ matrix.notebook }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --no-sync python docs/build_tutorials.py ${{ matrix.notebook }}
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-${{ matrix.page }}
          path: |
            docs/user/tutorials/${{ matrix.page }}.md
            docs/user/tutorials/${{ matrix.page }}_files
          if-no-files-found: error
          retention-days: 3

  build:
    # The site, from the rendered pages: their stamps match the notebooks, so the
    # mkdocs hook re-runs none (ACEJAX_DOCS_NOTEBOOKS=require makes a mismatch an
    # error rather than a silent serial re-run).
    needs: tutorial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ace-jax and the docs toolchain
        # the CLI reference is rendered from `aj --help` and the API reference
        # from the docstrings, so the package itself must be importable
        run: |
          uv sync --python 3.12 --frozen
          uv pip install -r docs/requirements.txt
      - name: Tutorial notebook cell graphs (needs marimo, a docs dependency)
        run: uv run --no-sync pytest -n 0 -q -p no:cacheprovider tests/test_tutorial_notebooks.py
      - uses: actions/download-artifact@v4
        with:
          pattern: tutorial-*
          path: docs/user/tutorials
          merge-multiple: true
      - name: Build the site (strict)
        env:
          ACEJAX_DOCS_NOTEBOOKS: require
        run: uv run --no-sync mkdocs build --strict
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
