name: coupling-wheels
# Build the juliac-compiled coupling library, package platform wheels, test them
# in clean environments (no Julia), and run ace-jax's coupling parity on them.
# Publishing (coupling/RELEASING.md): a `coupling-v<version>` tag uploads the
# tested wheels to PyPI; a manual run with publish=testpypi uploads to TestPyPI.
on:
  pull_request:
    paths:
      - "coupling/**"
      - "src/ace_jax/basis/**"
      - "src/ace_jax/fit/pipeline/data.py"
      - "src/ace_jax/cli.py"
      - "src/ace_jax/runfile.py"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/test_coupling_*.py"
      - "tests/test_basis_*.py"
      - "tests/test_fit_basis_pipeline.py"
      - "tests/test_cli_fit_basis.py"
      - "fixtures/coupling_ref_*.npz"
      - ".github/workflows/coupling-wheels.yml"
  push:
    tags: ["coupling-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "also upload the tested wheels (tags always go to PyPI)"
        type: choice
        options: [none, testpypi]
        default: none
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runner: ubuntu-latest,    container: "quay.io/pypa/manylinux_2_28_x86_64",  plat: manylinux_2_28_x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", plat: manylinux_2_28_aarch64 }
          - { name: macos-arm64,   runner: macos-14,         container: "",                                     plat: macosx_11_0_arm64 }
          - { name: windows-x86_64, runner: windows-latest,  container: "",                                     plat: win_amd64 }
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 60
    defaults: { run: { shell: bash } }   # Git Bash on Windows (a bare `bash` from pwsh can be WSL's)
    steps:
      - uses: actions/checkout@v4
      - name: Julia 1.13 (container)
        if: matrix.container != ''
        # official tarball, not juliaup: juliaup keeps state in ~/.julia/juliaup,
        # which the depot cache restores without the binaries
        run: |
          V=1.13.1; A=$(uname -m); D=$([ "$A" = x86_64 ] && echo x64 || echo aarch64)
          curl -fsSL "https://julialang-s3.julialang.org/bin/linux/$D/1.13/julia-$V-linux-$A.tar.gz" | tar xz -C /opt
          echo "/opt/julia-$V/bin" >> "$GITHUB_PATH"
      - name: Julia 1.13 (macOS, Windows)
        if: matrix.container == ''
        uses: julia-actions/setup-julia@v2
        with: { version: "1.13.1" }   # exact: == the Manifests' julia_version (build.jl checks)
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-${{ matrix.name }}-${{ hashFiles('coupling/julia/Manifest.toml', 'coupling/julia/build/Manifest.toml') }}
      - name: Build library
        run: |
          julia --project=coupling/julia/build -e 'using Pkg; Pkg.instantiate()'
          julia --project=coupling/julia/build coupling/julia/build.jl coupling/build
      - uses: actions/setup-python@v5          # macOS, Windows (Windows' bare python3 can be the Store stub)
        if: matrix.container == ''
        with: { python-version: "3.12" }
      - name: Python for pruning/packaging
        run: |
          PY=$( [ -x /opt/python/cp312-cp312/bin/python ] && echo /opt/python/cp312-cp312/bin/python || echo python )
          "$PY" -m venv .buildenv
          B=.buildenv/bin/python; [ -x "$B" ] || B=.buildenv/Scripts/python   # Windows venv layout
          "$B" -m pip install -q numpy build
          echo "BUILDPY=$B" >> "$GITHUB_ENV"
      - name: C compiler for the GPL placeholders (Windows)
        if: runner.os == 'Windows'
        run: gcc --version | head -1
      - name: Prune + check bundle
        run: |
          "$BUILDPY" coupling/tools/prune_bundle.py coupling/build/bundle coupling/build/pruned
          "$BUILDPY" coupling/tools/check_bundle.py coupling/build/pruned
      - name: Wheel
        env:
          ACEJAX_COUPLING_BUNDLE: ${{ github.workspace }}/coupling/build/pruned
          ACEJAX_COUPLING_PLAT: ${{ matrix.plat }}
        run: '"$BUILDPY" -m build --wheel coupling/python -o dist'
      - name: auditwheel (Linux, informational)
        if: matrix.container != ''
        run: |
          "$BUILDPY" -m pip install -q auditwheel
          "$BUILDPY" -m auditwheel show dist/*.whl || true   # gates: check_bundle.py (GLIBC <= 2.28) + the manylinux_2_28 test job
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.name }}", path: dist/*.whl, retention-days: 7 }

  test-wheel:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runner: ubuntu-latest,    container: "quay.io/pypa/manylinux_2_28_x86_64",  py: /opt/python/cp311-cp311/bin/python }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", py: /opt/python/cp313-cp313/bin/python }
          - { name: macos-arm64,   runner: macos-14,         container: "",                                     py: python3 }
          - { name: windows-x86_64, runner: windows-latest,  container: "",                                     py: python }
    name: test wheel ${{ matrix.name }} (no Julia)
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: "wheel-${{ matrix.name }}", path: dist }
      - run: bash coupling/tools/test_wheel.sh dist/*.whl ${{ matrix.py }}

  ace-jax-parity:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with: { name: wheel-linux-x86_64, path: dist }
      - name: Coupling parity on the built wheel
        env: { JAX_PLATFORM_NAME: cpu, JAX_ENABLE_X64: "1", ACEJAX_REQUIRE_OPTIONAL: "1" }
        run: |
          uv sync --python 3.12 --extra gp
          uv pip install --reinstall dist/*.whl
          uv run --no-sync pytest -n 0 -v tests/test_coupling_parity.py tests/test_coupling_etshim.py tests/test_coupling_cache.py tests/test_basis_build.py tests/test_fit_basis_pipeline.py tests/test_cli_fit_basis.py tests/test_built_basis_parity.py

  publish:
    # only after every platform's wheel built, passed its clean-environment tests,
    # and the x86_64 wheel passed ace-jax's coupling parity
    needs: [build, test-wheel, ace-jax-parity]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/coupling-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/ace-jax-coupling' || 'https://test.pypi.org/p/ace-jax-coupling' }}
    permissions:
      id-token: write          # PyPI trusted publishing (OIDC): no API token stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "wheel-*", path: dist, merge-multiple: true }
      - name: Check the release set
        # wheels only, no sdist: an sdist would build a library-less wheel on an
        # unsupported platform. Exactly the four platform wheels, none library-less,
        # and a tag must name the package version.
        env: { REF_NAME: "${{ github.ref_name }}", EVENT: "${{ github.event_name }}" }
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' coupling/python/pyproject.toml)
          if [ "$EVENT" = push ] && [ "$REF_NAME" != "coupling-v$V" ]; then
            echo "tag $REF_NAME does not match ace-jax-coupling $V"; exit 1
          fi
          ls dist
          for p in manylinux_2_28_x86_64 manylinux_2_28_aarch64 macosx_11_0_arm64 win_amd64; do
            test -f "dist/ace_jax_coupling-$V-py3-none-$p.whl" || { echo "missing $p wheel for $V"; exit 1; }
          done
          test "$(ls dist | wc -l)" -eq 4 || { echo "expected exactly 4 wheels"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # TestPyPI dry runs may add files to a version already there (e.g. a new
          # platform); a real release must fail loudly on any file PyPI already has
          skip-existing: ${{ github.event_name != 'push' }}
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
