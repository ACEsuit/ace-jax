name: coupling-parity
# Julia/ACEpotentials parity checks (CI-only; the runtime package is Julia-free).
# Path-gated: runs only when the fit/eval code, the Julia oracle, or the coupling
# shim change -- the pip-only test.yml covers everything else with no Julia.
on:
  pull_request:
    paths:
      - "src/ace_jax/construct/**"
      - "julia/**"
      - "tests/test_coupling_parity.py"
      - ".github/workflows/coupling-parity.yml"
  workflow_dispatch:

jobs:
  coupling-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "1.11" }
      - uses: astral-sh/setup-uv@v5

      # ACEpotentials is the ORACLE (CI-only). Add the ACE registry + deps.
      - name: Provision ACEpotentials (oracle)
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General");
                    Pkg.Registry.add(RegistrySpec(url="https://github.com/ACEsuit/ACEregistry"));
                    Pkg.activate("julia_oracle"; shared=false);
                    Pkg.add(["ACEpotentials","NPZ"])'

      # Regenerate the reference fixtures with THIS environment's ET, and pin the
      # bridge (juliapkg.json) to the SAME ET version so the two sides agree.
      - name: Regenerate coupling references + pin bridge ET
        run: |
          # ELEMENTS ORDER TOTALDEGREE WL OUTPATH.  Orders 2, 3 (production: the
          # Cantor model is order 3) and 4 (SiGe wL=0.5 has DEGENERATE nnll blocks).
          for shape in "Si,Ge 2 6 1.5 fixtures/coupling_ref_SiGe_o2d6.npz" \
                       "Cr,Mn,Fe 2 5 1.5 fixtures/coupling_ref_CrMnFe_o2d5.npz" \
                       "Cr,Mn,Fe 3 6 1.5 fixtures/coupling_ref_CrMnFe_o3d6.npz" \
                       "Si,Ge 4 5 0.5 fixtures/coupling_ref_SiGe_o4d5w05.npz"; do
            set -- $shape
            ACE_ELEMENTS=$1 ACE_ORDER=$2 ACE_TOTALDEGREE=$3 ACE_WL=$4 \
              julia --project=julia_oracle julia/coupling_reference.jl $5
          done
          ETV=$(julia --project=julia_oracle -e \
            'using ACEpotentials; println(pkgversion(ACEpotentials.Models.EquivariantTensors))')
          python - "$ETV" <<'PY'
          import json, sys
          j = {"julia": "~1.10, ~1.11", "packages": {"EquivariantTensors": {
                 "uuid": "5e107534-7145-4f8f-b06f-47a52840c895", "version": "=" + sys.argv[1]}}}
          json.dump(j, open("juliapkg.json", "w"), indent=2)
          print("pinned bridge ET to", sys.argv[1])
          PY

      - name: Run the numerical coupling parity (bridge vs oracle)
        run: |
          uv sync --extra authoring
          uv run pytest tests/test_coupling_parity.py -v
