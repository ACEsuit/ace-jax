name: coupling-parity
# Gate: the Python EquivariantTensors coupling bridge reproduces the COMMITTED
# reference coefficients (originally generated from ACEpotentials) bit-for-bit,
# for orders 2-4 including degenerate nnll blocks. Uses the `authoring` extra --
# juliacall + juliapkg auto-provision the pinned ET. No ACEpotentials install:
# the references are committed fixtures (regenerate them locally with
# julia/coupling_reference.jl when the pinned ET in juliapkg.json changes).
on:
  pull_request:
    paths:
      - "src/ace_jax/construct/**"
      - "tests/test_coupling_parity.py"
      - "juliapkg.json"
      - "fixtures/coupling_ref_*.npz"
      - ".github/workflows/coupling-parity.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coupling-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "1.11" }
      - uses: astral-sh/setup-uv@v5
      - name: Coupling bridge parity (ET bridge vs committed references)
        env:
          JAX_ENABLE_X64: "1"
        run: |
          uv sync --extra authoring
          uv run pytest tests/test_coupling_parity.py -v
