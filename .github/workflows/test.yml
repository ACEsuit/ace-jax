name: test
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to avoid CI pile-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Full pip-only suite on ONE Python, split into single-process shards across
    # separate runners (pytest-split). Single-process is what survives long runs
    # here (like the ladder job); xdist workers get the runner killed mid-run.
    # `-n 0` overrides tests/conftest.py, which parallelises a bare local `pytest`.
    # Each shard has its own VM + JAX compile cache. NO Julia.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jaxcache-${{ runner.os }}-g${{ matrix.group }}-${{ github.sha }}
          restore-keys: jaxcache-${{ runner.os }}-g${{ matrix.group }}-
      - name: Suite shard ${{ matrix.group }}/3 (CPU JAX)
        env:
          JAX_PLATFORM_NAME: cpu
          JAX_ENABLE_X64: "1"
        run: uv run --python 3.12 --extra gp pytest -n 0 -m "not slow" --splits 3 --group ${{ matrix.group }} --splitting-algorithm least_duration
  optional-deps:
    # The tests that skip without the optional dependencies: lammps-jax's export
    # (tests/test_export_lammps.py, the scaling suite's bundle export) and
    # matscipy-neighbours' native dense neighbour_matrix (the calculator's and
    # skin list's production neighbour path).  ACEJAX_REQUIRE_OPTIONAL turns
    # those skips into failures (tests/conftest.py `require_optional`), so a
    # broken install cannot pass as all-skipped.  lammps-jax's export is pure
    # Python + JAX (no compiled LAMMPS); pinned to a commit of its main branch.
    # Not test_perf_parity / test_gp_hostcache: their float32 gates and a 1e-12
    # LML check were set without matscipy-neighbours, whose edge order changes
    # the float rounding (they run, without it, in the shards above).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jaxcache-${{ runner.os }}-optional-${{ github.sha }}
          restore-keys: jaxcache-${{ runner.os }}-optional-
      - name: Install matscipy-neighbours (C++ source build) and lammps-jax
        run: |
          uv sync --python 3.12 --extra gp --extra fast-neighbours
          uv pip install "lammps-jax @ git+https://github.com/abhijeetgangan/lammps-jax@4a7f4fb27ecc689abd35c2a91833590e613edb51"
      - name: Optional-dependency tests (CPU JAX)
        env:
          JAX_PLATFORM_NAME: cpu
          JAX_ENABLE_X64: "1"
          ACEJAX_REQUIRE_OPTIONAL: "1"
        run: >-
          uv run --no-sync pytest -n 0 -m "not slow"
          tests/test_export_lammps.py tests/test_bench_scaling.py tests/test_calc_jit.py
          tests/test_efv.py tests/test_skin.py
  smoke:
    # Import + a small descriptor/EFV/kernel smoke on the other supported Pythons
    # -- a cheap compatibility check without re-running the whole (slow) matrix.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jaxcache-${{ runner.os }}-${{ github.sha }}
          restore-keys: jaxcache-${{ runner.os }}-
      - name: Import + smoke
        env:
          JAX_PLATFORM_NAME: cpu
          JAX_ENABLE_X64: "1"
        run: |
          uv run --python ${{ matrix.python }} --extra gp python -c "import ace_jax, ace_jax.fit, ace_jax.eval; print('import OK')"
          uv run --python ${{ matrix.python }} --extra gp pytest -m "not slow" \
            tests/test_descriptors.py tests/test_efv.py tests/test_gp_kernels.py -q
  ladder:
    # Heavy integration run ONCE (not per-Python): the real-model MCMC ladder
    # (MAP/Laplace/Pathfinder/NUTS, fast mode) and any other `slow` test.
    # Isolated so it can't slow the suite.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Slow tests (real-model ladder)
        env:
          JAX_PLATFORM_NAME: cpu
          JAX_ENABLE_X64: "1"
        run: uv run --extra gp pytest -n 0 -v -m slow
