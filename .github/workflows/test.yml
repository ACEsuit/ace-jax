name: test
on: [push, pull_request]
jobs:
  pytest:
    # Pip-only: NO Julia. Runs against the committed npz fixtures.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the suite (CPU JAX, no Julia)
        env:
          JAX_PLATFORM_NAME: cpu
          JAX_ENABLE_X64: "1"
        run: uv run --python ${{ matrix.python }} --extra gp --extra ase pytest -q
