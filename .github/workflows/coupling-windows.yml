name: coupling-windows
# Feasibility spike: does the juliac --trim coupling library build and run on
# Windows x64? Builds the library, shows the bundle layout, and runs the wheel's
# own tests (exact match to the oracle) against the unpruned bundle. Pruning,
# GPL placeholders and packaging come only once this works.
on:
  pull_request:
    paths:
      - "coupling/**"
      - ".github/workflows/coupling-windows.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "1.13.0", arch: x64 }   # == the Manifests' julia_version
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-windows-x64-${{ hashFiles('coupling/julia/Manifest.toml', 'coupling/julia/build/Manifest.toml') }}
      - name: Build library
        run: |
          julia --project=coupling/julia/build -e 'using Pkg; Pkg.instantiate()'
          julia --project=coupling/julia/build coupling/julia/build.jl coupling/build
      - name: Bundle layout
        if: always()
        run: |
          find coupling/build/bundle -maxdepth 2 | sort | head -80
          echo "--- DLLs:"; find coupling/build/bundle -iname "*.dll" | sort
          du -sh coupling/build/bundle || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Load and run the wheel tests against the bundle
        run: |
          python -m pip install -q numpy pytest
          LIB=$(cygpath -w "$PWD/$(find coupling/build/bundle -iname 'libetcouple.dll' | head -1)")   # absolute: tests run from coupling/python
          echo "ACEJAX_COUPLING_LIB=$LIB"
          export ACEJAX_COUPLING_LIB="$LIB" PYTHONPATH="$(cygpath -w "$PWD/coupling/python/src")"
          python -c "import ace_jax_coupling as a; print(a.build_info()); print(a.couple_raw([[(1, 0)], [(1, 1), (1, 1)]], [(1, 0), (1, 1), (2, 0)], [(0, 0), (1, -1), (1, 0), (1, 1)]).A2B_shape)"
          cd coupling/python && python -m pytest -q tests
