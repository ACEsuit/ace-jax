name: kernel-wheels
# ace-jax's platform wheels: the C++ kernel compiled in (eval/ffi.py `build_prebuilt`, hatch_build.py), so
# `ACECalculator(ffi=...)` and CPU LAMMPS bundles need no compiler.  Each wheel is built against the OLDEST
# supported jaxlib (ffi.PREBUILT_JAXLIB: a kernel built against a newer one does not load under an older),
# then installed in a clean environment outside the checkout and run under that jaxlib and the newest one.
# Linux builds run in manylinux_2_28 containers; the C++ runtime is linked statically.  Windows and Intel
# macOS take the pure wheel (the kernel is compiled on first use there).  publish.yml calls this workflow.
on:
  pull_request:
    paths:
      - src/ace_jax/eval/ace_ffi.cc
      - src/ace_jax/eval/ffi.py
      - hatch_build.py
      - pyproject.toml
      - tests/kernel_wheel_check.py
      - .github/workflows/kernel-wheels.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runner: ubuntu-latest,    container: "quay.io/pypa/manylinux_2_28_x86_64",  plat: manylinux_2_28_x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", plat: manylinux_2_28_aarch64 }
          - { name: macos-arm64,   runner: macos-15,         container: "",                                     plat: macosx_11_0_arm64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - name: uv (container)
        if: matrix.container != ''
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install -q uv
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
        if: matrix.container == ''
      - name: Compile the kernel against the oldest supported jaxlib
        run: |
          J=$(sed -n 's/^PREBUILT_JAXLIB = "\([0-9.]*\)".*/\1/p' src/ace_jax/eval/ffi.py)
          test -n "$J"
          uv venv --python 3.11 /tmp/kb
          uv pip install --python /tmp/kb/bin/python -e . "jax==$J" "jaxlib==$J"
          /tmp/kb/bin/python -c "import json; from ace_jax.eval import ffi; print(json.dumps(ffi.build_prebuilt('kernel'), indent=1))"
      - name: The libraries need only glibc <= 2.28 (Linux)
        if: matrix.container != ''
        run: |
          for f in kernel/*.so; do
            echo "$f"; readelf -d "$f" | grep NEEDED
            if readelf -d "$f" | grep -E 'libstdc\+\+|libgcc_s'; then echo "$f: the C++ runtime is not static"; exit 1; fi
          done
          max=$(objdump -T kernel/*.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc symbol: $max"
          test "$(printf '%s\n2.28\n' "$max" | sort -V | tail -1)" = "2.28"
      - name: The libraries' deployment target (macOS)
        if: matrix.container == ''
        run: |
          for f in kernel/*.so; do otool -L "$f"; otool -l "$f" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|platform'; done
      - name: Build the wheel
        env:
          ACEJAX_KERNEL_DIR: kernel
          ACEJAX_KERNEL_PLAT: ${{ matrix.plat }}
        run: |
          uv build --wheel --out-dir dist
          ls -l dist
          test "$(ls dist | wc -l)" = 1 && ls dist/ace_jax-*-py3-none-${{ matrix.plat }}.whl
      - uses: actions/upload-artifact@v4
        with: { name: "kernel-wheel-${{ matrix.name }}", path: dist, if-no-files-found: error }

  test:
    name: test wheel ${{ matrix.name }} (no compiler)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runner: ubuntu-latest,    container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64" }
          - { name: macos-arm64,   runner: macos-15,         container: "" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4            # for tests/kernel_wheel_check.py and fixtures/ only: the wheel is what runs
      - uses: actions/download-artifact@v4
        with: { name: "kernel-wheel-${{ matrix.name }}", path: dist }
      - name: uv (container)
        if: matrix.container != ''
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install -q uv
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
        if: matrix.container == ''
      - name: Run the prebuilt kernel under the oldest and the newest jaxlib
        env:
          JAX_PLATFORMS: cpu
        run: |
          J=$(sed -n 's/^PREBUILT_JAXLIB = "\([0-9.]*\)".*/\1/p' src/ace_jax/eval/ffi.py)
          W=$(ls "$PWD"/dist/*.whl); SRC=$PWD
          check() {     # python version, then extra requirements
            py=$1; shift
            uv venv --python "$py" "/tmp/t$py"
            uv pip install --python "/tmp/t$py/bin/python" "$W" "$@"
            (cd /tmp && "/tmp/t$py/bin/python" "$SRC/tests/kernel_wheel_check.py" "$SRC/fixtures")
            if [ "${{ matrix.name }}" = linux-x86_64 ]; then       # the variant for CPUs without AVX2
              (cd /tmp && "/tmp/t$py/bin/python" "$SRC/tests/kernel_wheel_check.py" "$SRC/fixtures" x86-64)
            fi
          }
          check 3.11 "jax==$J" "jaxlib==$J"
          check 3.13
